<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph chatbot pipeline</title>
  <desc id="desc">The workflow starts by retrieving memories, chats, then routes to tools, summarization, or the end. Tool calls loop back to chat.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#101a32"/></marker>
    <linearGradient id="start" x2="0" y2="1"><stop stop-color="#e1fff0"/><stop offset="1" stop-color="#bcf7d8"/></linearGradient>
    <linearGradient id="memory" x2="0" y2="1"><stop stop-color="#f0e5ff"/><stop offset="1" stop-color="#ddc7ff"/></linearGradient>
    <linearGradient id="chat" x2="0" y2="1"><stop stop-color="#e1efff"/><stop offset="1" stop-color="#c6defb"/></linearGradient>
    <linearGradient id="tool" x2="0" y2="1"><stop stop-color="#ddfff0"/><stop offset="1" stop-color="#b5f6d5"/></linearGradient>
    <linearGradient id="sum" x2="0" y2="1"><stop stop-color="#ffe9d5"/><stop offset="1" stop-color="#ffd1a9"/></linearGradient>
    <linearGradient id="end" x2="0" y2="1"><stop stop-color="#ffdce5"/><stop offset="1" stop-color="#ffb9c9"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#0b152d;text-anchor:middle;dominant-baseline:middle}
      .node{stroke-width:2.5}.edge{fill:none;stroke:#101a32;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .tag{fill:#eaf2ff;stroke:#aac3ef;stroke-width:1.5}
    </style>
  </defs>
  <rect width="900" height="600" fill="#fff"/>
  <!-- Main flow -->
  <rect class="node" x="350" y="18" width="200" height="56" rx="14" fill="url(#start)" stroke="#07552f"/>
  <text x="450" y="46" font-size="29" font-weight="700">START</text>
  <path class="edge" d="M450 74 V112"/>
  <rect class="node" x="318" y="116" width="264" height="62" rx="14" fill="url(#memory)" stroke="#6030b4"/>
  <text x="450" y="147" font-size="28" font-weight="700">remember</text>
  <path class="edge" d="M450 178 V218"/>
  <rect class="node" x="318" y="222" width="264" height="62" rx="14" fill="url(#chat)" stroke="#0753c9"/>
  <text x="450" y="253" font-size="28" font-weight="700">chat_node</text>
  <path class="edge" d="M450 284 V318"/>
  <!-- Router -->
  <path d="M450 320 L565 378 L450 440 L335 378 Z" fill="#f7f8fc" stroke="#101a32" stroke-width="2.5"/>
  <text x="450" y="378" font-size="20" font-weight="700">route_after_chat</text>
  <!-- tools branch and loop -->
  <path class="edge" d="M335 378 H235 Q215 378 215 398 V425"/>
  <rect class="tag" x="220" y="343" width="80" height="30" rx="13"/>
  <text x="260" y="358" font-size="19">tools</text>
  <rect class="node" x="150" y="430" width="150" height="60" rx="14" fill="url(#tool)" stroke="#07552f"/>
  <text x="225" y="460" font-size="26" font-weight="700">tools</text>
  <path class="edge" d="M150 460 H125 V254 Q125 253 145 253 H310"/>
  <!-- Summarize branch -->
  <path class="edge" d="M565 378 H690 Q710 378 710 398 V425"/>
  <rect class="tag" x="592" y="343" width="120" height="30" rx="13"/>
  <text x="652" y="358" font-size="19">summarize</text>
  <rect class="node" x="635" y="430" width="180" height="60" rx="14" fill="url(#sum)" stroke="#e34308"/>
  <text x="725" y="460" font-size="25" font-weight="700">summarize</text>
  <path class="edge" d="M725 490 V527"/>
  <!-- End routes -->
  <rect class="tag" x="412" y="447" width="76" height="30" rx="13"/>
  <text x="450" y="462" font-size="19">END</text>
  <path class="edge" d="M450 440 V526 Q450 550 474 550 H630"/>
  <rect class="node" x="635" y="528" width="180" height="58" rx="14" fill="url(#end)" stroke="#df1744"/>
  <text x="725" y="557" font-size="28" font-weight="700">END</text>
</svg>
